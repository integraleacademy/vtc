<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Intégrale Academy - Plateforme VTC{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #101827;
            --navy-soft: #1f3047;
            --ink: #111827;
            --muted: #536179;
            --gold: #f4c45a;
            --gold-deep: #e7a83a;
            --orange: #ff8a00;
            --orange-deep: #f05a16;
            --green: #24d16f;
            --surface: #ffffff;
            --line: #e9edf5;
            --shadow: 0 24px 70px rgba(16, 24, 39, 0.14);
            --radius-xl: 30px;
            --radius-lg: 22px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            margin: 0;
            background:
                radial-gradient(circle at 10% 8%, rgba(244, 196, 90, 0.24), transparent 30%),
                radial-gradient(circle at 78% 16%, rgba(255, 138, 0, 0.16), transparent 28%),
                linear-gradient(180deg, #fffaf1 0%, #f8fafc 48%, #ffffff 100%);
            color: var(--ink);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 78px 0 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(17, 24, 39, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(17, 24, 39, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.7), transparent 72%);
            z-index: -1;
        }

        a {
            color: inherit;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.88);
            border-bottom: 1px solid rgba(233, 237, 245, 0.95);
            backdrop-filter: blur(18px);
        }

        .nav-wrap {
            width: min(1220px, calc(100% - 32px));
            min-height: 78px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -0.04em;
        }

        .brand-logo {
            width: 62px;
            height: 62px;
            object-fit: contain;
            filter: drop-shadow(0 12px 26px rgba(16, 24, 39, 0.18));
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 0.92;
            font-size: 25px;
            text-transform: uppercase;
        }

        .brand-text span:last-child {
            color: var(--gold);
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 28px;
            color: #334155;
            font-size: 15px;
            font-weight: 650;
        }

        .main-nav a {
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .main-nav a:hover {
            color: var(--orange-deep);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn,
        button.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 999px;
            padding: 13px 19px;
            min-height: 46px;
            font-family: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }

        .btn:hover,
        button.btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            color: white;
            background: linear-gradient(135deg, var(--orange) 0%, var(--orange-deep) 100%);
            box-shadow: 0 16px 32px rgba(240, 90, 22, 0.28);
        }

        .btn-dark {
            color: white;
            background: var(--navy);
            box-shadow: 0 16px 32px rgba(16, 24, 39, 0.22);
        }

        .btn-gold {
            color: var(--navy);
            background: linear-gradient(135deg, #ffe08a 0%, var(--gold-deep) 100%);
            box-shadow: 0 16px 32px rgba(231, 168, 58, 0.24);
        }

        .container,
        .container-full,
        .landing-shell {
            width: min(1220px, calc(100% - 32px));
            margin: 0 auto;
        }

        .container {
            max-width: 820px;
            margin-top: 34px;
            margin-bottom: 42px;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border: 1px solid rgba(233, 237, 245, 0.9);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .container-full {
            width: min(1500px, calc(100% - 28px));
            margin-top: 30px;
            margin-bottom: 42px;
            background: rgba(255, 255, 255, 0.94);
            padding: 24px;
            border: 1px solid rgba(233, 237, 245, 0.9);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .landing-shell {
            padding: 54px 0 64px;
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }

        h2 {
            color: var(--navy);
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8deea;
            border-radius: 13px;
            color: var(--ink);
            background: #fff;
            font: inherit;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--gold-deep);
            box-shadow: 0 0 0 4px rgba(244, 196, 90, 0.22);
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 800;
        }

        button {
            font-family: inherit;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--gold);
            color: black;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        @media (max-width: 980px) {
            .nav-wrap {
                min-height: auto;
                padding: 14px 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .main-nav,
            .nav-actions {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
            }

            .main-nav {
                gap: 18px;
            }
        }

        @media (max-width: 640px) {
            .brand-logo {
                width: 52px;
                height: 52px;
            }

            .brand-text {
                font-size: 21px;
            }

            .nav-actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            .container,
            .container-full,
            .landing-shell {
                width: min(100% - 20px, 1220px);
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-wrap">
            <a class="brand" href="{{ url_for('index') }}" aria-label="Accueil Intégrale Academy">
                <img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Logo Intégrale Academy">
                <span class="brand-text"><span>Intégrale</span><span>Academy</span></span>
            </a>
            <nav class="main-nav" aria-label="Navigation principale">
                <a href="{{ url_for('index') }}#formation">Formation VTC</a>
                <a href="{{ url_for('index') }}#inscription">Inscription examen</a>
                <a href="{{ url_for('index') }}#avantages">Accompagnement</a>
                <a href="{{ url_for('admin') }}">Admin</a>
            </nav>
            <div class="nav-actions">
                <a class="btn btn-gold" href="{{ url_for('index') }}#inscription">Nous contacter</a>
                <a class="btn btn-dark" href="{{ url_for('index') }}#inscription">S'inscrire →</a>
            </div>
        </div>
    </header>
    <main class="{% if request.path == '/' %}landing-shell{% elif 'admin' in request.path %}container-full{% else %}container{% endif %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
