<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Intégrale Academy - Plateforme VTC{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --midnight: #16253a;
            --midnight-2: #213754;
            --cream: #fff8eb;
            --paper: #ffffff;
            --ink: #142033;
            --muted: #66738a;
            --gold: #f4c45a;
            --gold-2: #e5a946;
            --coral: #e9572f;
            --amber: #ff8a00;
            --success: #1fbf71;
            --line: #e7eaf0;
            --shadow-soft: 0 22px 60px rgba(20, 32, 51, 0.13);
            --shadow-strong: 0 32px 90px rgba(20, 32, 51, 0.22);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: 'Inter', 'Poppins', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(244, 196, 90, 0.18), transparent 34rem),
                linear-gradient(180deg, #fffdf8 0%, #f5f7fb 54%, #ffffff 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, transparent 0 24%, rgba(244, 196, 90, 0.08) 24% 25%, transparent 25% 100%),
                linear-gradient(150deg, transparent 0 64%, rgba(233, 87, 47, 0.06) 64% 65%, transparent 65% 100%);
            z-index: -1;
        }

        a {
            color: inherit;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(22, 37, 58, 0.96);
            border-bottom: 1px solid rgba(244, 196, 90, 0.18);
            box-shadow: 0 16px 40px rgba(22, 37, 58, 0.16);
            backdrop-filter: blur(16px);
        }

        .nav-wrap {
            width: min(1180px, calc(100% - 32px));
            min-height: 82px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 28px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 13px;
            color: white;
            text-decoration: none;
        }

        .brand-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(244, 196, 90, 0.30), 0 14px 30px rgba(0, 0, 0, 0.24);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 0.98;
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        .brand-text span:last-child {
            color: var(--gold);
        }

        .main-nav {
            display: flex;
            justify-content: center;
            gap: clamp(16px, 3vw, 34px);
            color: rgba(255, 255, 255, 0.82);
            font-size: 15px;
            font-weight: 650;
        }

        .main-nav a {
            position: relative;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .main-nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -8px;
            height: 2px;
            border-radius: 999px;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.2s ease;
        }

        .main-nav a:hover {
            color: white;
        }

        .main-nav a:hover::after {
            transform: scaleX(1);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn,
        button.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 46px;
            padding: 13px 20px;
            border: 0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 850;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .btn:hover,
        button.btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            color: #1b2332;
            background: linear-gradient(135deg, #ffe49a 0%, var(--gold) 52%, var(--gold-2) 100%);
            box-shadow: 0 18px 34px rgba(229, 169, 70, 0.25);
        }

        .btn-dark {
            color: white;
            background: linear-gradient(135deg, var(--midnight) 0%, #0e1725 100%);
            box-shadow: 0 18px 34px rgba(14, 23, 37, 0.22);
        }

        .btn-ghost {
            color: white;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
        }

        .container,
        .container-full,
        .landing-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .landing-shell {
            padding: 42px 0 74px;
        }

        .container {
            max-width: 820px;
            margin-top: 34px;
            margin-bottom: 42px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(231, 234, 240, 0.95);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
        }

        .container-full {
            width: min(1500px, calc(100% - 28px));
            margin-top: 30px;
            margin-bottom: 42px;
            padding: 24px;
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(231, 234, 240, 0.95);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }

        h2 {
            color: var(--midnight);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2e3d53;
            font-size: 14px;
            font-weight: 800;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9deea;
            border-radius: 13px;
            color: var(--ink);
            background: #fff;
            font: inherit;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--gold-2);
            box-shadow: 0 0 0 4px rgba(244, 196, 90, 0.22);
        }

        button {
            font-family: inherit;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 10px;
            color: black;
            text-align: left;
            background: var(--gold);
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        @media (max-width: 1040px) {
            .nav-wrap {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 16px 0;
            }

            .main-nav {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 6px;
            }

            .nav-actions {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .brand-logo {
                width: 50px;
                height: 50px;
            }

            .brand-text {
                font-size: 20px;
            }

            .nav-actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            .container,
            .container-full,
            .landing-shell {
                width: min(100% - 20px, 1180px);
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-wrap">
            <a class="brand" href="{{ url_for('index') }}" aria-label="Accueil Intégrale Academy">
                <img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Logo Intégrale Academy">
                <span class="brand-text"><span>Intégrale</span><span>Academy</span></span>
            </a>
            <nav class="main-nav" aria-label="Navigation principale">
                <a href="{{ url_for('index') }}#formation">Formation VTC</a>
                <a href="{{ url_for('index') }}#inscription">Inscription examen</a>
                <a href="{{ url_for('index') }}#parcours">Parcours</a>
                <a href="{{ url_for('admin') }}">Admin</a>
            </nav>
            <div class="nav-actions">
                <a class="btn btn-ghost" href="{{ url_for('index') }}#inscription">Nous contacter</a>
                <a class="btn btn-primary" href="{{ url_for('index') }}#inscription">Déposer mon dossier</a>
            </div>
        </div>
    </header>
    <main class="{% if request.path == '/' %}landing-shell{% elif 'admin' in request.path %}container-full{% else %}container{% endif %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
